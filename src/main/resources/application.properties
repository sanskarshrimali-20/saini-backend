spring.application.name=saini
server.port=${PORT:8080}

# Database configuration using environment variables for cloud deployment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/saini_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:saini_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:saini_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Razorpay credentials using environment variables
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TK4dWcLDb2QWWL}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:YXD2hHiEPVgaQxX5LEymvY2X}